<h1 mat-dialog-title class="login-title">Log In</h1>

<div mat-dialog-content class="login-dialog-content">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" required>
      <mat-error *ngIf="loginForm.controls['username'].hasError('required')">
        Username is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Your password... it's a secret!</mat-label>
      <input matInput type="password" formControlName="password" required>
      <mat-error *ngIf="loginForm.controls['password'].hasError('required')">
        Password is required
      </mat-error>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions class="login-dialog-actions">
  <button mat-button mat-dialog-close class="cancel-btn">Cancel</button>
  <button mat-button class="login-btn" [disabled]="loginForm.invalid" (click)="onLogin()">Log in</button>
</div>
