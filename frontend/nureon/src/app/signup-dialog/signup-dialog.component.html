<h1>Sign up!</h1>

<form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" class="sign-up-card">
  <mat-form-field appearance="outline">
    <mat-label>Username</mat-label>
    <input matInput formControlName="username" required>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>E-mail</mat-label>
    <input matInput formControlName="email" type="email" required>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Confirm E-mail</mat-label>
    <input matInput formControlName="confirmEmail" type="email" required>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput formControlName="password" type="password" required>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Confirm Password</mat-label>
    <input matInput formControlName="confirmPassword" type="password" required>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Birth date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="birthDate" required>
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Gender</mat-label>
    <mat-select formControlName="gender">
      <mat-option *ngFor="let gender of genders" [value]="gender">{{ gender }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Type</mat-label>
    <mat-select formControlName="userType">
      <mat-option *ngFor="let type of userTypes" [value]="type">{{ type }}</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Button section with swapped positions -->
  <div class="button-row">
    <button mat-stroked-button color="warn" type="button" (click)="onCancel()" class="cancel-btn">Cancel</button>
    <button mat-stroked-button color="primary" type="submit" (click)="onSubmit()" class="create-account-btn">Create account</button>
  </div>
</form>
