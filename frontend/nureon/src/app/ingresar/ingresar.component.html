<app-page-container>
  <section class="ingresar-form">
    <h1 class="nureon-heading">Ingresá a tu cuenta</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (emailError) {
          <mat-error>{{ emailError }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        @if (passwordError) {
          <mat-error>{{ passwordError }}</mat-error>
        }
      </mat-form-field>

      <!-- Sin ruta propia todavía (fuera del árbol de la Etapa 2) — se dibuja igual. -->
      <p class="ingresar-form__forgot">¿Olvidaste tu contraseña?</p>

      @if (submitError) {
        <p class="ingresar-form__error" role="alert">{{ submitError }}</p>
      }

      <app-brand-button variant="primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Ingresando…' : 'Ingresar' }}
      </app-brand-button>
    </form>

    <!-- Ranura RNF09: dibujados pero inertes hasta que Cognito exista. -->
    <div class="ingresar-form__social">
      <button type="button" class="social-button social-button--google">Continuar con Google</button>
      <button type="button" class="social-button social-button--facebook">Continuar con Facebook</button>
    </div>

    <p class="ingresar-form__signup">
      ¿No tenés cuenta? <a routerLink="/registro">Registrate</a>
    </p>
  </section>
</app-page-container>
