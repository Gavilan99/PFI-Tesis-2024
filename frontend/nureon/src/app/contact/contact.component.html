<div class="contact-container">
    <mat-card class="contact-card">
      <mat-card-header>
        <mat-card-title class="title">Contact Us</mat-card-title>
      </mat-card-header>
  
      <mat-card-content>
        <form class="contact-form">
          <!-- Name Field -->
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Name</mat-label>
            <input matInput placeholder="Enter your name" required>
          </mat-form-field>
  
          <!-- Email Field -->
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Email</mat-label>
            <input matInput type="email" placeholder="Enter your email" required>
          </mat-form-field>
  
          <!-- Message Field -->
          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Message</mat-label>
            <textarea matInput placeholder="Enter your message" rows="6" required></textarea>
          </mat-form-field>
  
          <!-- Submit Button -->
          <button mat-raised-button color="primary" class="submit-btn">Submit</button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
