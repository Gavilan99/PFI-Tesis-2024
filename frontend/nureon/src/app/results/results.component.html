<div class="results-container">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <div class="top-part">
        <h2 class="header-text">Results Header</h2>
    </div>
    <div class="bottom-part">
        <div class="left-bottom-part">
            <img [src]="imageSrc" alt="Personality Type Image" />
        </div>
        <div class="right-bottom-part">
            <div class="right-header">
                <h3>Your enneatype is: <span>{{ enneatype }}</span></h3>
            </div>
            <div class="right-body">
                <div class="info-box">
                    <h4 style="font-weight: bold;">Wanna know more about your type?</h4>
                    <p>Get the full report to unlock these results and include them in your personality analysis and recommendations.</p>
                    <button class="access-button">GET ACCESS NOW</button>
                </div>
            </div>
        </div>
    </div>
</div>
