services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nureon
      POSTGRES_PASSWORD: nureon
      POSTGRES_DB: nureon_dev
    ports:
      - "5433:5432"
    volumes:
      - nureon_pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nureon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nureon_pg_data:
